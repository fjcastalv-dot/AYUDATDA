name: Desplegar Web App en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detectar ubicación de package.json
        id: locate-app
        run: |
          if [ -f "package.json" ]; then
            echo "app_dir=." >> $GITHUB_OUTPUT
          elif [ -f "TDA/package.json" ]; then
            echo "app_dir=TDA" >> $GITHUB_OUTPUT
          else
            echo "Error: No se encontró package.json"
            exit 1
          fi

      - name: Instalar dependencias
        working-directory: ${{ steps.locate-app.outputs.app_dir }}
        run: npm install

      - name: Compilar y exportar aplicación web Next.js
        working-directory: ${{ steps.locate-app.outputs.app_dir }}
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Preparar artefacto para GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-app.outputs.app_dir }}/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
